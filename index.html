<style>
.charSelect{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#090819e8;backdrop-filter:blur(5px)}
.charSelect.hide{display:none}.selectPanel{width:min(92vw,620px);padding:22px;border:2px solid #55eaff;border-radius:18px;background:#18112d;box-shadow:0 0 28px #00eaff66,0 0 55px #ff36dc33}
.selectTitle{text-align:center;font-size:26px;font-weight:900;color:#fff;text-shadow:0 0 12px #55eaff}.selectSub{text-align:center;color:#d9cfff;margin:7px 0 17px}
.charGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.charCard{min-height:112px;border-radius:14px;border:2px solid currentColor;background:#181325;color:white;font-size:16px;box-shadow:inset 0 0 18px #ffffff0b}
.charCard b,.charCard span{display:block}.charCard b{font-size:19px;margin-bottom:9px}.charCard span{font-size:12px;opacity:.9}.charCard.shield{color:#52edff;box-shadow:0 0 15px #00eaff55}.charCard.katana{color:#73ff4c;box-shadow:0 0 15px #32ff0055}.charCard.rapier{color:#ff65e6;box-shadow:0 0 15px #ff32dc66}.charCard.dual{color:#ffb44d;box-shadow:0 0 15px #ff7a2255}.charCard.club{color:#ff755e;box-shadow:0 0 15px #ff452d66}.charCard.spear{color:#ffe36b;box-shadow:0 0 15px #ffbd3266}
@media(max-width:520px){.charGrid{grid-template-columns:1fr}.charCard{min-height:72px}.selectPanel{padding:15px}.charCard b{margin-bottom:3px}}
</style>
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>盾閃 - Junsen</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#17140f;color:#f5e6c8;font-family:system-ui,"Noto Sans JP",sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:linear-gradient(#8e7a55 0 58%,#5b4931 58%)}
.hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;gap:20px;padding:12px}
.card{width:44%;text-shadow:0 2px 2px #000}
.name{font-weight:900;letter-spacing:.08em}
.bar{height:14px;border:2px solid #e8d6ad;background:#241c14;margin-top:4px}
.fill{height:100%;background:#b23b2d;width:100%}
.meter{height:9px;border:1px solid #e8d6ad;background:#241c14;margin-top:5px}
.meter>div{height:100%;background:#d8a62d;width:0}
#msg{position:fixed;top:22%;left:0;right:0;text-align:center;font-size:clamp(24px,6vw,54px);font-weight:1000;text-shadow:0 4px 8px #000;pointer-events:none}
.controls{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;align-items:end;padding:0 18px;gap:28px}
.controls>.dpad{flex:0 0 210px}
.controls>.attack{flex:0 0 168px;margin-left:auto}
.cluster{display:grid;grid-template-columns:repeat(2,70px);gap:8px}
.dpad{position:relative;width:210px;height:210px}
.dpad button{position:absolute}
.dup{left:70px;top:0}.dleft{left:0;top:70px}.dright{left:140px;top:70px}.ddown{left:70px;top:140px}
button{width:70px;height:70px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:50%;border:2px solid #e9d7ae;background:#32281dcc;color:#fff;font-size:15px;font-weight:900;box-shadow:0 3px 0 #0c0907;touch-action:none}
button:active,.pressed{transform:translateY(2px);background:#7a3328}
.attack{grid-template-columns:repeat(2,78px)}
.attack button{width:78px;height:78px}
#guard{background:#31536dcc}
#heavy{background:#74362ecc}
.smallnote{position:fixed;bottom:103px;left:0;right:0;text-align:center;font-size:12px;opacity:.9;pointer-events:none}
@media(min-width:800px){button{width:82px;height:82px}.cluster{grid-template-columns:repeat(2,82px)}.attack{grid-template-columns:repeat(2,90px)}.attack button{width:90px;height:90px}.dpad{width:246px;height:246px}.dup{left:82px}.dleft{top:82px}.dright{left:164px;top:82px}.ddown{left:82px;top:164px}}
</style>
</head>
<body>
<div id="charSelect" class="charSelect">
 <div class="selectPanel">
  <div class="selectTitle">使用キャラ選択</div>
  <div class="selectSub">対戦相手は選ばなかったキャラから登場</div>
  <div class="charGrid">
   <button class="charCard shield" data-char="shield"><b>盾剣武者</b><span>盾＋光剣 / 堅守</span></button>
   <button class="charCard katana" data-char="katana"><b>刀武者</b><span>緑光刀 / 受け流し</span></button>
   <button class="charCard rapier" data-char="rapier"><b>レイピア剣士</b><span>高速突き / 大踏み込み</span></button><button class="charCard dual" data-char="dual"><b>二刀侍</b><span>二連斬 / 十字受け</span></button><button class="charCard club" data-char="club"><b>棍棒豪傑</b><span>拳・蹴り / 豪快な棍棒</span></button><button class="charCard spear" data-char="spear"><b>槍兵</b><span>長い両手突き / 縦槍ガード</span></button>
  </div>
 </div>
</div>
<canvas id="game"></canvas>
<div class="hud">
  <div class="top">
    <div class="card"><div class="name">PLAYER</div><div class="bar"><div id="php" class="fill"></div></div><div class="meter"><div id="pm"></div></div></div>
    <div class="card" style="text-align:right"><div class="name">黄巾武将 CPU</div><div class="bar"><div id="ehp" class="fill" style="margin-left:auto"></div></div><div class="meter"><div id="em" style="margin-left:auto"></div></div></div>
  </div>
</div>
<div id="msg">盾閃</div>
<div class="smallnote">十字キー ↑/↓ で攻撃・盾の高さを選択　←← / →→でステップ　攻撃長押し→離す：ゲージ満タン時 必殺</div>
<div class="controls">
 <div class="dpad">
  <button class="dup" data-act="up">↑</button>
  <button class="dleft" data-act="left">←</button>
  <button class="dright" data-act="right">→</button>
  <button class="ddown" data-act="down">↓</button>
 </div>
 <div class="cluster attack">
  <button id="guard" data-act="guard">ガード</button><button data-act="small">小攻撃</button>
  <span></span><button id="heavy" data-act="heavy">大攻撃</button>
 </div>
</div>
<script src="game.js"></script>
</body></html>
<style>
@media(max-width:600px){
  .controls{padding:0 10px;gap:10px}
  .dpad{width:190px;height:190px;flex-basis:190px!important}
  .dpad button{width:64px;height:64px}
  .dup{left:63px!important;top:0!important}
  .dleft{left:0!important;top:63px!important}
  .dright{left:126px!important;top:63px!important}
  .ddown{left:63px!important;top:126px!important}
  .controls>.attack{width:150px;flex-basis:150px!important;grid-template-columns:72px 72px;column-gap:6px;row-gap:12px}
  .attack button{width:72px;height:72px}
  #guard{transform:translateY(-18px)}
  #guard:active,#guard.pressed{transform:translateY(-16px)}
}
</style>
